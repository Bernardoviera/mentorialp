    #particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

    .avatar-ring { position: absolute; inset: -6px; border-radius: 50%; border: 1px solid rgba(96,165,250,.2); animation: ringPulse 3s ease-in-out infinite; }
    @keyframes ringPulse { 0%,100% { transform: scale(1); opacity: .4; } 50% { transform: scale(1.06); opacity: .9; } }

    .link-btn:hover { transform: translateY(-3px); }
    .link-btn:hover::before { opacity: 1; }
    .link-btn:active { transform: translateY(0) scale(.98); }
    .link-icon { flex-shrink: 0; width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
    .link-label { flex: 1; }
    .link-arrow { color: var(--muted); transition: transform .25s ease, color .25s ease; flex-shrink: 0; }
    .link-btn:hover .link-arrow { transform: translateX(4px); color: var(--text); }
    .btn-whatsapp { border-color: rgba(37,211,102,.3); background: rgba(37,211,102,.06); }

.btn-mentoria { border-color: rgba(96,165,250,.25); background: rgba(37,99,235,.06); }

    .lp-footer { margin-top: 40px; font-size: .75rem; color: rgba(148,163,184,.4); text-align: center; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  <script>
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let W, H, particles = [];
    function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
    resize(); window.addEventListener('resize', resize);
    class Particle {
      constructor() { this.reset(); }
      reset() { this.x=Math.random()*W; this.y=Math.random()*H; this.r=Math.random()*1.5+0.3; this.speed=Math.random()*0.3+0.08; this.angle=Math.random()*Math.PI*2; this.pulse=Math.random()*Math.PI*2; }
      update() { this.x+=Math.cos(this.angle)*this.speed; this.y+=Math.sin(this.angle)*this.speed; this.pulse+=0.02; this.opacity=Math.sin(this.pulse)*0.2+0.3; if(this.x<0||this.x>W||this.y<0||this.y>H) this.reset(); }
      draw() { ctx.save(); ctx.globalAlpha=this.opacity; ctx.fillStyle='#60a5fa'; ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,Math.PI*2); ctx.fill(); ctx.restore(); }
    }
    for(let i=0;i<60;i++) particles.push(new Particle());
    (function loop(){ ctx.clearRect(0,0,W,H); particles.forEach(p=>{p.update();p.draw();}); requestAnimationFrame(loop); })();
  </script>
